<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">La Partage — an example with $10 on red</title><desc id="desc">For any permitted even-money stake: when zero lands, half is returned and half is lost. This example splits $10 into $5 returned and $5 lost.</desc><defs><linearGradient id="felt" x2=".8" y2="1"><stop stop-color="#8d2530"/><stop offset="1" stop-color="#50151c"/></linearGradient><linearGradient id="red" x2="1" y2="1"><stop stop-color="#ae2b39"/><stop offset="1" stop-color="#851c29"/></linearGradient><linearGradient id="black" x2="1" y2="1"><stop stop-color="#171717"/><stop offset="1" stop-color="#020202"/></linearGradient><filter id="nap"><feTurbulence baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect x="1" y="1" width="478" height="478" rx="28" fill="#080808" stroke="#f1e8da70" stroke-width="1" /><rect x="8" y="8" width="464" height="464" rx="23" fill="url(#black)" stroke="#3d3832" stroke-width="1" /><rect x="23" y="23" width="434" height="434" rx="14" fill="url(#felt)" stroke="#f1e8da88" stroke-width="1" /><rect x="25" y="25" width="430" height="430" rx="12" fill="#fff" opacity=".055" filter="url(#nap)"/><text x="240" y="47" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#f1e8da" letter-spacing="2">LA PARTAGE</text><text x="240" y="75" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#f1e8da" >ONE EXAMPLE: $10 ON RED</text><rect x="128" y="99" width="224" height="65" rx="4" fill="url(#red)" stroke="#f1e8da" stroke-width="1.5" /><text x="250" y="131" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#f1e8da" >RED</text><g class="example-chip" data-x="153" data-y="131" transform="translate(153 131)"><circle cy="2" r="22" fill="#000" opacity=".5"/><circle r="20" fill="#f1e8da" stroke="#090909" stroke-width="2"/><circle r="17" fill="none" stroke="#8e2530" stroke-width="5" stroke-dasharray="6 6"/><circle r="14" fill="#111" stroke="#f1e8da" stroke-width="1"/><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#f1e8da" >10</text></g><path d="M240 173v24m-6-7 6 7 6-7" fill="none" stroke="#f1e8da" stroke-width="2"/><rect x="152" y="207" width="176" height="55" rx="4" fill="#e6ddca" stroke="#f1e8da" stroke-width="1.5" /><text x="240" y="236" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-size="23" font-weight="600" fill="#17130f" >0 LANDS</text><path d="M240 271v18H132v23m108-23h108v23m-222-6 6 6 6-6m204 0 6 6 6-6" fill="none" stroke="#f1e8da" stroke-width="2"/><rect x="45" y="323" width="174" height="82" rx="4" fill="#e6ddca" stroke="#f1e8da" stroke-width="1.5" /><text x="132" y="350" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-size="30" font-weight="600" fill="#17130f" >$5</text><text x="132" y="382" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#17130f" >RETURNED TO YOU</text><rect x="261" y="323" width="174" height="82" rx="4" fill="url(#red)" stroke="#f1e8da" stroke-width="1.5" /><text x="348" y="350" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-size="30" font-weight="600" fill="#f1e8da" >$5</text><text x="348" y="382" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#f1e8da" >LOST</text><text x="240" y="430" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#f1e8da" >Net result: −$5, rather than −$10</text><text x="240" y="455" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#f1e8da" >Any permitted stake · any even-money box</text></svg>